name: noteの新着を反映

on:
  schedule:
    - cron: "17 21 * * *"   # 毎朝6:17（日本時間）
  workflow_dispatch: {}      # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_note.py
      - name: 変更があればコミット
        run: |
          if [ -n "$(git status --porcelain data/posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posts.json
            git commit -m "noteの新着を反映"
            git push
          fi
